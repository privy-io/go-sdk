name: Promote SDKs

# Auto-promote: fast-forward production main up to staging main on every push to staging
# main (and on manual dispatch), preserving SHAs so the trunks stay identical and linear.
# Releases stay human-gated — release-please opens a version PR on production; a maintainer
# merges it. Self-routes by repo so this one file can live in both staging and production.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: stlc-promote
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ${{ vars.STLC_RUNNER || 'ubuntu-latest' }}
    if: github.repository == 'privy-io/go-sdk-private'
    environment: builder-blobby-sdk-sync-and-seal
    env:
      PRODUCTION_REPO: privy-io/go-sdk
    steps:
      - name: Check out staging
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mint production-repo-scoped Builder Blobby token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: go-sdk
          permission-contents: write
          permission-workflows: write

      - name: Fetch production main
        env:
          PRODUCTION_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git remote add production \
            "https://x-access-token:${PRODUCTION_REPO_TOKEN}@github.com/${PRODUCTION_REPO}.git"
          git fetch production main

      - name: Promote staging to production (fast-forward)
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor origin/main production/main; then
            # Production may be ahead because release-please added commits that have
            # not reached staging yet. The back-sync workflow will copy them back.
            echo "Production already contains staging main. Nothing to promote."
          elif git merge-base --is-ancestor production/main origin/main; then
            git push production origin/main:refs/heads/main
            echo "Fast-forwarded production/main to staging/main."
          else
            echo "::error title=Promote blocked::Production and staging main have diverged. Back-sync or reconcile the trunks first."
            exit 1
          fi
