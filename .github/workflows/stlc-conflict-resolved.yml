name: Notify config repo of conflict resolution

on:
  push:
    # Only the main trunk opens conflict PRs, so only `main--integrated` ever exists.
    branches: ['main--integrated']

jobs:
  dispatch:
    # The config repo's "Create conflict PR" step force-pushes a synthetic integrated
    # commit to `main--integrated`, and App-token pushes DO trigger this workflow — which
    # would dispatch recovery to the config repo before the conflict is resolved (and it
    # would then try to absorb an unresolved commit). Skip those: the synthetic commit is
    # authored by the build bot, whereas a real resolution — a PR merge or a human's local
    # merge landing here — is authored by a person. Mirrors the seal-dispatch loop-guard in
    # stlc-sync.yml; a skipped job spins up no runner. `!github.event.deleted` also skips a
    # branch-deletion push (which has no head commit to inspect).
    if: ${{ !github.event.deleted && github.event.head_commit.author.name != 'builder-blobby[bot]' }}
    runs-on: ubuntu-latest
    environment: builder-blobby-sdk-sync-and-seal
    steps:
      - name: Generate Builder Blobby token for config repo
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: stainless-sdks-config

      - name: Send repository_dispatch to config repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESOLVED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          target_branch="${BRANCH%--integrated}"
          GH_HOST=github.com gh api repos/privy-io/stainless-sdks-config/dispatches \
            -X POST \
            -f event_type=conflict-resolved \
            -f 'client_payload[branch]='"$target_branch" \
            -f 'client_payload[resolved_sha]='"$RESOLVED_SHA" \
            -f 'client_payload[workspace]=server-sdks' \
            -f 'client_payload[target]=go'
