name: Release Please
on:
  push:
    branches:
      - main

# One run per branch at a time, and never cancel one mid-release: a cancelled run could
# leave a tag without its GitHub Release or a release PR half-updated.
concurrency:
  group: release-please-${{ github.ref_name }}
  cancel-in-progress: false

# The default GITHUB_TOKEN is intentionally not granted write here: release-please runs
# with the builder-blobby app token minted below. Only the release-proposal job grants
# GITHUB_TOKEN pull-requests: write, to comment on the release PR.
permissions:
  contents: read

jobs:
  release-please:
    if: github.repository == 'privy-io/go-sdk-private'
    runs-on: ubuntu-latest
    environment: builder-blobby-sdk-sync-and-seal
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # Mint a short-lived builder-blobby installation token scoped to this repo. Go has no
      # package registry to publish to, but an app token (not the default GITHUB_TOKEN) is
      # still required so the created Release triggers stlc-promote (on: release), which
      # promotes the release to privy-io/go-sdk — the default token cannot trigger other
      # workflows. The version-bump commit — written through the GitHub API and signed
      # server-side — shows as Verified (builder-blobby[bot]); no GPG key needed.
      - name: Mint builder-blobby token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BUILDER_BLOBBY_APP_ID }}
          private-key: ${{ secrets.BUILDER_BLOBBY_APP_PRIVATE_KEY }}
          owner: privy-io
          repositories: go-sdk-private
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  release-proposal:
    name: Post release proposal
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Augment the release PR with the release proposal: the exact source SHA and a
      # compare link from the last published tag. See RELEASING.md.
      - name: Check out release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release

      - name: Build release proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release/proposal-comment.sh > "$RUNNER_TEMP/release-proposal.md"

      - name: Post release proposal to the release PR
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          number: ${{ fromJSON(needs.release-please.outputs.pr).number }}
          header: release-proposal
          path: ${{ runner.temp }}/release-proposal.md
